name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The sms hook (step 3.1) calls the app that the end-to-end tests start on port 3100.
      # A local-only secret, the same as in playwright.config.ts; not used in production.
      - name: Start local Supabase
        run: pnpm db:start
        env:
          SUPABASE_AUTH_SMS_HOOK_URI: http://host.docker.internal:3100/api/webhooks/supabase/send-sms
          SUPABASE_AUTH_SMS_HOOK_SECRET: v1,whsec_Ym9qZW4tbG9jYWwtc21zLWhvb2stbm90LWEtc2VjcmV0

      - name: Test
        run: pnpm test

      # Booking page end to end, widget and Lighthouse (step 2.5). Empties and seeds the
      # CI database, which is thrown away afterwards.
      - name: Install Chromium for Playwright
        run: pnpm --filter @bojen/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
